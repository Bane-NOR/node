name: Container Build

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 2 * * *'

permissions: write-all

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    strategy:
      matrix:
        version: [3.17.10,3.20.6,3.21.3,latest]

    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Registry Login
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Convert IMAGE_NAME to lowercase
      id: lowercase
      run: echo "IMAGE_NAME=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Map version to tag
      id: map
      run: |
        case "${{ matrix.version }}" in
          "3.17.10") echo "tag=18" >> $GITHUB_OUTPUT ;;
          "3.20.6") echo "tag=20" >> $GITHUB_OUTPUT ;;
          "3.21.3") echo "tag=22" >> $GITHUB_OUTPUT ;;
          "latest") echo "tag=latest" >> $GITHUB_OUTPUT ;;
        esac

    - name: Build and Push
      if: ${{ matrix.version != '3.20.6' }}
      run: docker buildx build --build-arg ALPINE_VERSION=${{ matrix.version }} --platform linux/amd64 -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.map.outputs.tag }}" --push -f Dockerfile .
  
    - name: Build and Push with Dockerfile-node20
      if: ${{ matrix.version == '3.20.6' }}
      run: docker buildx build --build-arg ALPINE_VERSION=${{ matrix.version }} --platform linux/amd64 -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.map.outputs.tag }}" --push -f Dockerfile-node20 .
