name: Container Build

on:
  push:
    branches: ["fix/auto-pull-node-images"]
  schedule:
    - cron: '0 2 * * *'

permissions: write-all

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    strategy:
      matrix:
        version: [18,20,22,latest]

    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Registry Login
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Convert IMAGE_NAME to lowercase
      id: lowercase
      run: echo "IMAGE_NAME=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Find Node versions
      id: find-versions
      run: docker pull node:${{ matrix.version }} && docker inspect node:${{ matrix.version }} | jq '.[0].Config.Env[] | select(startswith("NODE_VERSION="))' >> $GITHUB_OUTPUT
    - name: Map version to tag
      id: map
      run: |
        case "${{ matrix.version }}" in
          "18") echo "tag=18" >> $GITHUB_OUTPUT ;;
          "20") echo "tag=20" >> $GITHUB_OUTPUT ;;
          "22") echo "tag=22" >> $GITHUB_OUTPUT ;;
          "latest") echo "tag=latest" >> $GITHUB_OUTPUT ;;
        esac

    - name: Build and Push
      run: docker buildx build --build-arg NODE_VERSION=${{ steps.find-versions.outputs }} --platform linux/amd64 -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.map.outputs.tag }}test-preview" --push -f Dockerfile .
